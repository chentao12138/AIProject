# Test profile: unit-test friendly.
# Excludes DataSource / JDBC auto-config so unit tests do not require a real database.
#
# Important: MybatisPlusAutoConfiguration does not itself require a DataSource,
# so it must be explicitly excluded in the unit-test profile as well.
# SPIKE-002 MySQL integration tests use a separate profile (see application-it.yml)
# where DataSourceAutoConfiguration + MybatisPlusAutoConfiguration both stay ON.

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
