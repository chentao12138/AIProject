# Production profile.
#
# Required placeholders MUST be supplied by the runtime environment.
# Startup fails immediately when any required value is absent.

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AIStudyProdHikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  sql:
    init:
      mode: never

server:
  address: "${SERVER_ADDRESS:0.0.0.0}"
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

server.error:
  include-exception: false
  include-message: never
  include-stacktrace: never
  include-binding-errors: never

app:
  auth:
    jwt:
      secret: "${AUTH_JWT_SECRET}"

aistudy:
  storage:
    local:
      root: "${AISTUDY_STORAGE_LOCAL_ROOT}"
  cors:
    allowed-origins: "${AISTUDY_CORS_ALLOWED_ORIGINS}"
  ai:
    enabled: "${AISTUDY_AI_ENABLED:false}"
    provider: "${AISTUDY_AI_PROVIDER:openai-compatible}"
    base-url: "${AISTUDY_AI_BASE_URL:}"
    api-key: "${AISTUDY_AI_API_KEY:}"
    model: "${AISTUDY_AI_MODEL:}"
    secret-key: "${AISTUDY_AI_SECRET_KEY:}"
