spring:
  application:
    name: AIStudyServer
  main:
    banner-mode: "off"

  sql:
    init:
      mode: never

  # Canonical multipart contract.
  #
  # - max-file-size  = canonical asset limit (env AISTUDY_UPLOAD_MAX_FILE_SIZE)
  # - max-request-size > max-file-size to absorb multipart protocol overhead
  #   (env AISTUDY_UPLOAD_MAX_REQUEST_SIZE)
  servlet:
    multipart:
      max-file-size: ${AISTUDY_UPLOAD_MAX_FILE_SIZE:1024MB}
      max-request-size: ${AISTUDY_UPLOAD_MAX_REQUEST_SIZE:1040MB}

# Canonical application property defaults.
#
# - upload.max-file-size = same ceiling as the servlet layer, enforced again
#   in SourceAssetService / LocalStorageService.
# - storage.local.root = env-overridable persistent storage location.
# - cors.allowed-origins intentionally empty by default; profiles must
#   supply explicit origins.
aistudy:
  upload:
    max-file-size: ${AISTUDY_UPLOAD_MAX_FILE_SIZE:1024MB}
  storage:
    local:
      root: ${AISTUDY_STORAGE_LOCAL_ROOT:${user.home}/.aistudy/resources}
  cors:
    allowed-origins: ${AISTUDY_CORS_ALLOWED_ORIGINS:}
  operations:
    storage-reconciliation:
      max-scan-entries: ${AISTUDY_OPS_RECONCILE_MAX_SCAN:10000}
      min-age: ${AISTUDY_OPS_RECONCILE_MIN_AGE:PT1H}
  ingestion:
    worker:
      # Bounded pool for the in-process ingestion worker (architecture.md §6.2).
      # Overflow jobs stay QUEUED and are dispatched by the recovery tick.
      core-size: ${AISTUDY_INGESTION_WORKER_CORE_SIZE:2}
      max-size: ${AISTUDY_INGESTION_WORKER_MAX_SIZE:4}
      queue-capacity: ${AISTUDY_INGESTION_WORKER_QUEUE_CAPACITY:64}
      shutdown-grace: ${AISTUDY_INGESTION_WORKER_SHUTDOWN_GRACE:PT20S}
      # A claim older than this is treated as abandoned and requeued.
      stale-lease: ${AISTUDY_INGESTION_WORKER_STALE_LEASE:PT30M}
      heartbeat: ${AISTUDY_INGESTION_WORKER_HEARTBEAT:PT5M}
      recovery-interval-ms: ${AISTUDY_INGESTION_WORKER_RECOVERY_INTERVAL_MS:60000}
      recovery-enabled: ${AISTUDY_INGESTION_WORKER_RECOVERY_ENABLED:true}
    zip:
      max-entries: ${AISTUDY_INGESTION_ZIP_MAX_ENTRIES:10000}
      max-entry-uncompressed-bytes: ${AISTUDY_INGESTION_ZIP_MAX_ENTRY_BYTES:4GB}
      max-total-uncompressed-bytes: ${AISTUDY_INGESTION_ZIP_MAX_TOTAL_BYTES:16GB}
      max-compression-ratio: ${AISTUDY_INGESTION_ZIP_MAX_RATIO:200}
    review:
      # Audit F-06: rows below these confidences become MEDIUM review issues.
      # null confidence means "no signal" (text-layer PDF, non-OCR asset) and is
      # never flagged.
      order-confidence-threshold: ${AISTUDY_ORDER_CONFIDENCE_THRESHOLD:0.7}
      outline-confidence-threshold: ${AISTUDY_OUTLINE_CONFIDENCE_THRESHOLD:0.6}
      # Cap on ORDER_LOW_CONFIDENCE rows per revision; the first issue says how
      # many more pages exist so the review screen cannot look complete by accident.
      max-issues-per-revision: ${AISTUDY_INGESTION_REVIEW_MAX_ISSUES:50}
    text:
      max-document-bytes: ${AISTUDY_INGESTION_TEXT_MAX_DOCUMENT_BYTES:64MB}
    pdf:
      max-bytes: ${AISTUDY_INGESTION_PDF_MAX_BYTES:100MB}
      max-pages: ${AISTUDY_INGESTION_PDF_MAX_PAGES:200}
      max-extracted-chars: ${AISTUDY_INGESTION_PDF_MAX_EXTRACTED_CHARS:2000000}
    image:
      max-bytes: ${AISTUDY_INGESTION_IMAGE_MAX_BYTES:50MB}
      max-width: ${AISTUDY_INGESTION_IMAGE_MAX_WIDTH:10000}
      max-height: ${AISTUDY_INGESTION_IMAGE_MAX_HEIGHT:10000}
      max-pixels: ${AISTUDY_INGESTION_IMAGE_MAX_PIXELS:100000000}
  # OCR (F-09 / F-10 / F-28). Disabled by default: the plain app image ships no
  # PaddleOCR runtime, and "attempt and swallow the error" was how a missing
  # binary used to turn into silently textless pages.
  #
  # engine = none | process | http
  #   process: local executable, protocol documented on PaddleOcrProcessEngine
  #   http:    the deploy/ocr sidecar, protocol documented on HttpOcrEngine
  ocr:
    enabled: ${AISTUDY_OCR_ENABLED:false}
    engine: ${AISTUDY_OCR_ENGINE:none}
    # Wall-clock deadline for one OCR run (process or HTTP). Past it the child
    # is destroyed and the stage fails with OCR_TIMEOUT — an unbounded wait used
    # to occupy an ingestion worker until the job claim went stale.
    timeout: ${AISTUDY_OCR_TIMEOUT:PT2M}
    # Patience between SIGTERM and SIGKILL after a timeout.
    kill-grace: ${AISTUDY_OCR_KILL_GRACE:PT5S}
    # Ceilings: stdout is still drained to EOF past the cap so the child can
    # never block on a full pipe; the run then fails with OCR_OUTPUT_TOO_LARGE.
    max-stdout-bytes: ${AISTUDY_OCR_MAX_STDOUT_BYTES:262144}
    max-output-bytes: ${AISTUDY_OCR_MAX_OUTPUT_BYTES:8MB}
    max-diagnostics-chars: ${AISTUDY_OCR_MAX_DIAGNOSTICS_CHARS:2000}
    # Below this the source goes to human review (OCR_LOW_CONFIDENCE issue).
    confidence-threshold: ${AISTUDY_OCR_CONFIDENCE_THRESHOLD:0.7}
    # review = keep partial results and flag for review (backward compatible),
    # fail = publish FAILED / PARTIAL_FAILED with a diagnosable code.
    on-failure: ${AISTUDY_OCR_ON_FAILURE:review}
    paddle-ocr-command: ${AISTUDY_OCR_PADDLE_OCR_COMMAND:paddleocr}
    temp-dir: ${AISTUDY_OCR_TEMP_DIR:${java.io.tmpdir}/aistudy/ocr}
    # Health detail id is `ocr`. Non-strict on purpose: a DEGRADED custom status
    # can never become the composite, so a cold OCR sidecar cannot make the
    # backend fail its container health check and restart-loop.
    health-strict: ${AISTUDY_OCR_HEALTH_STRICT:false}
    health-probe-timeout: ${AISTUDY_OCR_HEALTH_PROBE_TIMEOUT:PT2S}
    http:
      base-url: ${AISTUDY_OCR_HTTP_BASE_URL:}
      path: ${AISTUDY_OCR_HTTP_PATH:/ocr}
      token: ${AISTUDY_OCR_HTTP_TOKEN:}
      connect-timeout: ${AISTUDY_OCR_HTTP_CONNECT_TIMEOUT:PT5S}
      max-response-bytes: ${AISTUDY_OCR_HTTP_MAX_RESPONSE_BYTES:8MB}
      max-image-bytes: ${AISTUDY_OCR_HTTP_MAX_IMAGE_BYTES:20MB}
  ai:
    # AI is disabled by default. Enable only with a configured provider.
    enabled: ${AISTUDY_AI_ENABLED:false}
    provider: ${AISTUDY_AI_PROVIDER:openai-compatible}
    base-url: ${AISTUDY_AI_BASE_URL:}
    api-key: ${AISTUDY_AI_API_KEY:}
    model: ${AISTUDY_AI_MODEL:}
    # AES-GCM master key (Base64 ≥256-bit) for encrypting runtime BYOK secrets.
    secret-key: ${AISTUDY_AI_SECRET_KEY:}
    temperature: ${AISTUDY_AI_TEMPERATURE:0.3}
    max-output-tokens: ${AISTUDY_AI_MAX_OUTPUT_TOKENS:1024}
    connect-timeout: ${AISTUDY_AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AISTUDY_AI_READ_TIMEOUT:60s}
    context:
      max-search-results: ${AISTUDY_AI_CONTEXT_MAX_SEARCH_RESULTS:8}
      max-context-chars: ${AISTUDY_AI_CONTEXT_MAX_CHARS:12000}
      max-user-message-chars: ${AISTUDY_AI_CONTEXT_MAX_USER_MESSAGE_CHARS:8000}
      max-history-messages: ${AISTUDY_AI_CONTEXT_MAX_HISTORY_MESSAGES:20}
      max-learning-state-items: ${AISTUDY_AI_CONTEXT_MAX_LEARNING_STATE_ITEMS:8}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,storage
          # The `ocr` detail (ingestion/ocr/OcrHealthIndicator) is NOT in
          # readiness by default: an OCR sidecar that is cold or down must not
          # take the whole API out of rotation, since only image/scanned-PDF
          # ingestion depends on it. Operators who want that coupling add it:
          #   include: readinessState,db,storage,ocr
          # and set AISTUDY_OCR_HEALTH_STRICT=true so the indicator reports DOWN
          # instead of DEGRADED. See docs/operations-ocr-docker.md.
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: AIStudyServer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
  mapper-locations: classpath:/mapper/*.xml

app:
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:}
      access-token-ttl-seconds: ${AUTH_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} requestId=%X{requestId:-} - %msg%n"
  level:
    root: INFO
    com.aistudy: INFO
    com.baomidou.mybatisplus: INFO
