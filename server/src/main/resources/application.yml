spring:
  application:
    name: AIStudyServer
  main:
    banner-mode: "off"

  # DataSource is NOT configured in the default profile.
  # The real MySQL connection is defined in application-it.yml for SPIKE-002
  # and will be finalized when SPIKE-003 introduces Flyway-based migrations.
  #
  # Local development flow (from Windows PowerShell, after export-ing env vars):
  #   export DB_URL, DB_USERNAME, DB_PASSWORD   (see deploy/local/mysql/.env)
  #   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=it

  sql:
    init:
      mode: never

  # BUSINESS-004: multipart upload limits (NFR-SEC-002). Env-overridable
  # via AISTUDY_MAX_UPLOAD_SIZE (default 1GB). The service layer ALSO
  # checks aistudy.upload.max-file-size itself — the servlet limit is
  # defense-in-depth, not the only guard.
  servlet:
    multipart:
      max-file-size: ${AISTUDY_MAX_UPLOAD_SIZE:1024MB}
      max-request-size: ${AISTUDY_MAX_UPLOAD_SIZE:1024MB}

# BUSINESS-004: business-side upload limit (service-level check) and
# storage root (ADR-033). Root is env-overridable via
# AISTUDY_STORAGE_ROOT (e.g. D:\AIStudyData\resources on Windows,
# /data/ai-study/resources on Linux); fallback is cross-platform and
# outside the Git repo.
aistudy:
  upload:
    max-file-size: ${AISTUDY_MAX_UPLOAD_SIZE:1024MB}
  storage:
    local:
      root: ${AISTUDY_STORAGE_ROOT:${user.home}/.aistudy/resources}
  # ELECTRON-CORS-001-B: explicit Browser CORS origins for the Desktop
  # client. Env override: AISTUDY_CORS_ALLOWED_ORIGINS (comma separated).
  # The security default is exactly these two Electron renderer origins —
  # a missing env value NEVER degrades to "*" (see ServerCorsConfig).
  cors:
    allowed-origins: ${AISTUDY_CORS_ALLOWED_ORIGINS:http://localhost:5173,app://aistudy}
  # BUSINESS-005: ZIP safety inspection limits (ZipArchiveInspector).
  # Env-overridable via AISTUDY_INGESTION_ZIP_*; defaults are generous
  # for scanned textbook packages while bounding decompression bombs.
  # NOTE: encrypted ZIPs are ALWAYS rejected in V1 (pure-JDK cannot
  # read them; no reject-encrypted toggle exists —
  # AUTORUN-4H-PRE-RUNTIME-FIX-01).
  ingestion:
    zip:
      max-entries: ${AISTUDY_INGESTION_ZIP_MAX_ENTRIES:10000}
      max-entry-uncompressed-bytes: ${AISTUDY_INGESTION_ZIP_MAX_ENTRY_BYTES:4GB}
      max-total-uncompressed-bytes: ${AISTUDY_INGESTION_ZIP_MAX_TOTAL_BYTES:16GB}
      max-compression-ratio: ${AISTUDY_INGESTION_ZIP_MAX_RATIO:200}
    # BUSINESS-006: bounded text ingestion (ContentExtractionService).
    # Env-overridable via AISTUDY_INGESTION_TEXT_MAX_DOCUMENT_BYTES.
    text:
      max-document-bytes: ${AISTUDY_INGESTION_TEXT_MAX_DOCUMENT_BYTES:64MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

server:
  address: 127.0.0.1
  port: 8080

logging:
  level:
    root: INFO
    com.aistudy: INFO
    com.baomidou.mybatisplus: INFO
