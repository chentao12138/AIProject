services:
  mysql:
    image: mysql:8.4
    container_name: aistudy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - aistudy_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - aistudy_net

  backend:
    build:
      # Maven project root is server/; Dockerfile expects .mvn/mvnw/pom/src there.
      context: ../server
      dockerfile: ../Dockerfile
    container_name: aistudy-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      AISTUDY_STORAGE_LOCAL_ROOT: /var/lib/aistudy/resources
      AISTUDY_CORS_ALLOWED_ORIGINS: ${AISTUDY_CORS_ALLOWED_ORIGINS:?set AISTUDY_CORS_ALLOWED_ORIGINS in .env}
      AISTUDY_BOOTSTRAP_ADMIN_ENABLED: "true"
      AISTUDY_BOOTSTRAP_ADMIN_USERNAME: "${AISTUDY_BOOTSTRAP_ADMIN_USERNAME:?set AISTUDY_BOOTSTRAP_ADMIN_USERNAME in .env}"
      AISTUDY_BOOTSTRAP_ADMIN_PASSWORD: "${AISTUDY_BOOTSTRAP_ADMIN_PASSWORD:?set AISTUDY_BOOTSTRAP_ADMIN_PASSWORD in .env}"
      # AI-001 optional env defaults. Leave AISTUDY_AI_ENABLED=false unless a
      # provider key is supplied via .env / secrets platform — never bake keys.
      AISTUDY_AI_ENABLED: "${AISTUDY_AI_ENABLED:-false}"
      AISTUDY_AI_PROVIDER: "${AISTUDY_AI_PROVIDER:-openai-compatible}"
      AISTUDY_AI_BASE_URL: "${AISTUDY_AI_BASE_URL:-}"
      AISTUDY_AI_MODEL: "${AISTUDY_AI_MODEL:-}"
      AISTUDY_AI_API_KEY: "${AISTUDY_AI_API_KEY:-}"
      AISTUDY_AI_SECRET_KEY: "${AISTUDY_AI_SECRET_KEY:-}"
      # --- OCR (F-10 / I-15) -------------------------------------------------
      # Off unless the ocr profile is enabled, so `docker compose up -d` on a
      # small host still boots a working backend whose PDFs use their text
      # layer. Turn it on with AISTUDY_OCR_ENABLED=true AND --profile ocr.
      # Failure path when OCR is unavailable: on-failure=fail means the job
      # stops with OCR_UNAVAILABLE / OCR_TIMEOUT / OCR_OUTPUT_TOO_LARGE in its
      # errorCode + safe message instead of publishing textless pages, and it
      # is bounded by AISTUDY_OCR_TIMEOUT rather than hanging a worker.
      AISTUDY_OCR_ENABLED: "${AISTUDY_OCR_ENABLED:-false}"
      AISTUDY_OCR_ENGINE: "${AISTUDY_OCR_ENGINE:-http}"
      AISTUDY_OCR_HTTP_BASE_URL: "${AISTUDY_OCR_HTTP_BASE_URL:-http://ocr:8891}"
      AISTUDY_OCR_HTTP_TOKEN: "${AISTUDY_OCR_HTTP_TOKEN:-}"
      AISTUDY_OCR_TIMEOUT: "${AISTUDY_OCR_TIMEOUT:-PT2M}"
      AISTUDY_OCR_ON_FAILURE: "${AISTUDY_OCR_ON_FAILURE:-fail}"
      AISTUDY_OCR_CONFIDENCE_THRESHOLD: "${AISTUDY_OCR_CONFIDENCE_THRESHOLD:-0.7}"
      AISTUDY_OCR_HEALTH_STRICT: "${AISTUDY_OCR_HEALTH_STRICT:-false}"
    volumes:
      - aistudy_resources:/var/lib/aistudy/resources
    networks:
      - aistudy_net
    # Do not expose the backend port on the host. A reverse proxy
    # terminates TLS and forwards traffic to this container.
    # ports:
    #   - "127.0.0.1:8080:8080"

  # OCR sidecar (F-10 / I-15). Opt-in profile so a host without the 3-5 GB
  # paddle image can still deploy the text-only backend:
  #   docker compose --profile ocr up -d --build
  # No `depends_on` from backend: the backend must come up when OCR is still
  # loading its models, and it reports that as the `ocr` health detail
  # (DEGRADED, never DOWN) instead of being restarted by its own healthcheck.
  ocr:
    profiles: ["ocr"]
    build:
      context: ./ocr
      dockerfile: Dockerfile
    image: aistudy-ocr:${AISTUDY_OCR_TAG:-latest}
    container_name: aistudy-ocr
    restart: unless-stopped
    environment:
      OCR_LANG: "${AISTUDY_OCR_LANG:-ch}"
      OCR_DEVICE: "${AISTUDY_OCR_DEVICE:-cpu}"
      # One prediction at a time: the paddle predictor is not thread-safe and
      # concurrent inferences on a capped container is how OCR gets OOM-killed.
      OCR_THREADS: "${AISTUDY_OCR_THREADS:-1}"
      OCR_QUEUE_DEPTH: "${AISTUDY_OCR_QUEUE_DEPTH:-8}"
      OCR_MAX_IMAGE_BYTES: "${AISTUDY_OCR_MAX_IMAGE_BYTES:-33554432}"
      OCR_MAX_TEXT_CHARS: "${AISTUDY_OCR_MAX_TEXT_CHARS:-2000000}"
      OCR_TOKEN: "${AISTUDY_OCR_HTTP_TOKEN:-}"
    volumes:
      # Model cache: survives redeploys, and is the directory an air-gapped
      # host must pre-seed (see docs/operations-ocr-docker.md).
      - aistudy_ocr_models:/home/aistudy-ocr/.paddleocr
    deploy:
      resources:
        limits:
          cpus: "${AISTUDY_OCR_CPUS:-2.0}"
          memory: "${AISTUDY_OCR_MEMORY:-4G}"
          # Hard ceiling on process/thread count: paddle spawns native worker
          # threads, and unbounded fan-out inside one container takes the whole
          # host down. Set inside deploy because compose rejects a top-level
          # pids_limit alongside deploy resource limits.
          pids: 256
        reservations:
          memory: "${AISTUDY_OCR_MEMORY_RESERVATION:-1G}"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # /healthz only returns 200 after the models have actually loaded, so
      # "healthy" here means "OCR can serve a request", not "the port is open".
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8891/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s
    networks:
      - aistudy_net

volumes:
  aistudy_mysql_data:
    name: aistudy_mysql_data
  aistudy_resources:
    name: aistudy_resources
  aistudy_ocr_models:
    name: aistudy_ocr_models

networks:
  aistudy_net:
    name: aistudy_net
    driver: bridge
