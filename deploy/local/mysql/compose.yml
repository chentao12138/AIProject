services:
  mysql:
    image: mysql:8.4
    container_name: aistudy-mysql-spike
    hostname: mysql
    restart: unless-stopped
    environment:
      # Real passwords are only allowed in the gitignored .env file.
      # This compose file must not carry hardcoded fallback values.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - aistudy_spike_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - aistudy_spike_net

volumes:
  aistudy_spike_data:
    name: aistudy_spike_data

networks:
  aistudy_spike_net:
    name: aistudy_spike_net
    driver: bridge
